name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Provider Releases
    runs-on: ubuntu-latest
    env:
      TERRAFORM_VERSION: "1.15.7"
      TFLINT_VERSION: "v0.63.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          cache: true

      - name: Plan provider releases
        id: release-plan
        run: python3 .github/scripts/release_providers.py plan --output "$RUNNER_TEMP/provider-releases.json"

      - name: Terraform package checks
        if: steps.release-plan.outputs.has_releases == 'true'
        run: python3 .github/scripts/release_providers.py check --plan "$RUNNER_TEMP/provider-releases.json"

      - name: Init TFLint plugins
        if: steps.release-plan.outputs.has_releases == 'true'
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        if: steps.release-plan.outputs.has_releases == 'true'
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" -f compact

      - name: Run Checkov
        if: steps.release-plan.outputs.has_releases == 'true'
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli

      - name: Run Trivy IaC scan
        if: steps.release-plan.outputs.has_releases == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.73.0

      - name: Publish provider releases
        if: steps.release-plan.outputs.has_releases == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_providers.py apply --plan "$RUNNER_TEMP/provider-releases.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
